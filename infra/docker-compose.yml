services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: bb-${ENV}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    profiles: ['local', 'staging', 'prod']
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT}
          cpus: ${POSTGRES_CPU_LIMIT}
        reservations:
          memory: ${POSTGRES_MEMORY_RESERVATION}
          cpus: ${POSTGRES_CPU_RESERVATION}
    # PostgreSQL optimizations for low memory
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS}
      -c effective_cache_size=${POSTGRES_CACHE_SIZE}
      -c maintenance_work_mem=${POSTGRES_MAINTENANCE_MEM}
      -c work_mem=${POSTGRES_WORK_MEM}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS}
      -c wal_buffers=1MB
      -c random_page_cost=1.1

  # Backend Application (only for staging/prod)
  backend:
    image: biplace-backend:${ENV}
    container_name: bb-${ENV}-backend
    networks:
      - internal
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ['staging', 'prod']
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT}
          cpus: ${BACKEND_CPU_LIMIT}
        reservations:
          memory: ${BACKEND_MEMORY_RESERVATION}
          cpus: ${BACKEND_CPU_RESERVATION}

  # Metabase Analytics
  metabase:
    image: metabase/metabase:v0.49.3
    container_name: bb-${ENV}-metabase
    environment:
      MB_SITE_URL: ${METABASE_SITE_URL:-https://metabase-staging.duckparapente.fr}
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase}
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      JAVA_OPTS: -Xmx1g
    networks:
      - internal
      - proxy
    depends_on:
      - postgres
    restart: unless-stopped
    profiles: ['staging', 'prod']
    volumes:
      - metabase_data:/metabase-data
    expose:
      - '3000'
    deploy:
      resources:
        limits:
          memory: ${METABASE_MEMORY_LIMIT:-1536M}
          cpus: ${METABASE_CPU_LIMIT:-1.0}
        reservations:
          memory: ${METABASE_MEMORY_RESERVATION:-768M}
          cpus: ${METABASE_CPU_RESERVATION:-0.5}

  # Caddy Reverse Proxy (only for staging/prod)
  caddy:
    image: caddy:2
    container_name: bb-${ENV}-caddy
    expose:
      - '80'
    networks:
      - internal
      - proxy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - postgres
      - backend
    restart: unless-stopped
    profiles: ['staging', 'prod']
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT}
          cpus: ${CADDY_CPU_LIMIT}
        reservations:
          memory: ${CADDY_MEMORY_RESERVATION}
          cpus: ${CADDY_CPU_RESERVATION}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  metabase_data:

networks:
  internal:
    name: ${ENV}_internal_network
  proxy:
    external: true
